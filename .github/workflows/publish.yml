name: Build and Publish Docker image to GitHub

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: leandrodalbo/match-insights-ui

jobs:
  package:
    name: Package and Publish
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Read node version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Log into container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NODE_VERSION=${{ env.NODE_VERSION }} \
            --build-arg API_HOST=${{ secrets.API_HOST }} \
            --build-arg USE_API_MOCK=${{ secrets.USE_API_MOCK }} \
            --build-arg IP_CHECK_HOST=${{ secrets.IP_CHECK_HOST }} \
            --build-arg GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID }} \
            --build-arg SHOW_BANNERS=${{ secrets.SHOW_BANNERS }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
